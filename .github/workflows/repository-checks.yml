# Lightweight structural checks. The model itself is not run here; numerical
# reproduction is validated at release time (see CONTRIBUTING.md#releases).
name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Links, paths, environment variables, generated artifacts
        run: python scripts/ci/check_repository.py

      - name: Validate CITATION.cff
        run: |
          pip install --quiet cffconvert
          cffconvert --validate
