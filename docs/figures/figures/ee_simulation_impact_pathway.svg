<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .h { font: 700 20px Arial, sans-serif; fill: #111827; }
      .t { font: 500 16px Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px Arial, sans-serif; fill: #374151; }
      .box { fill: #f3f4f6; stroke: #111827; stroke-width: 2; }
      .outbox { fill: #e5e7eb; stroke: #111827; stroke-width: 2.5; }
      .pos { fill: #065f46; font-weight: 700; }
      .neg { fill: #991b1b; font-weight: 700; }
      .neu { fill: #1f2937; font-weight: 700; }
      .arrow { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#111827" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>
  <text x="40" y="52" class="title">EE Simulation Impact Pathway (results-based, Directive10 vs EE_PDP8)</text>

  <text x="120" y="98" class="h">Scenario shocks</text>
  <text x="590" y="98" class="h">Model channels</text>
  <text x="1040" y="98" class="h">Observed outcomes</text>

  <rect class="box" x="40" y="130" rx="14" ry="14" width="360" height="125"/>
  <text x="60" y="165" class="t">Higher EE ambition (Directive10)</text>
  <text x="60" y="195" class="small">- Stronger energy productivity path (exo_AI)</text>
  <text x="60" y="220" class="small">- Higher near-term EE capex (exo_GA)</text>

  <rect class="box" x="40" y="295" rx="14" ry="14" width="360" height="125"/>
  <text x="60" y="330" class="t">NoBESS counterfactual pair</text>
  <text x="60" y="360" class="small">- BESS channels reset to baseline</text>
  <text x="60" y="385" class="small">- Isolates BESS contribution (small macro effect)</text>

  <rect class="box" x="40" y="460" rx="14" ry="14" width="360" height="165"/>
  <text x="60" y="495" class="t">Calibration/result scope</text>
  <text x="60" y="525" class="small">- Horizon: 2026-2050</text>
  <text x="60" y="550" class="small">- Compared years: 2030, 2040, 2050</text>
  <text x="60" y="575" class="small">- Four EE scenarios on PDP8 baseline</text>
  <text x="60" y="600" class="small">- Source: ee_simulation_scenarios_results.md</text>

  <rect class="box" x="500" y="145" rx="14" ry="14" width="360" height="95"/>
  <text x="520" y="180" class="t">Energy productivity improvement</text>
  <text x="520" y="208" class="small">Less energy input per output unit</text>

  <rect class="box" x="500" y="275" rx="14" ry="14" width="360" height="95"/>
  <text x="520" y="310" class="t">Investment-consumption reallocation</text>
  <text x="520" y="338" class="small">Near-term capex increase, later payoff</text>

  <rect class="box" x="500" y="405" rx="14" ry="14" width="360" height="95"/>
  <text x="520" y="440" class="t">Energy system composition effect</text>
  <text x="520" y="468" class="small">Intensity/final-demand shifts with EE gains</text>

  <rect class="box" x="500" y="535" rx="14" ry="14" width="360" height="95"/>
  <text x="520" y="570" class="t">Policy regime constraint</text>
  <text x="520" y="598" class="small">No binding carbon cap in EE-only runs</text>

  <rect class="outbox" x="980" y="130" rx="14" ry="14" width="380" height="520"/>
  <text x="1000" y="170" class="t">Quantitative outcomes from simulation</text>

  <text x="1000" y="215" class="small">GDP level (Directive10 vs EE_PDP8):</text>
  <text x="1000" y="240" class="small pos">+0.44% (2030), +0.58% (2040), +0.45% (2050)</text>

  <text x="1000" y="285" class="small">Investment share deviation:</text>
  <text x="1000" y="310" class="small">+0.205 pp (2030), +0.092 pp (2040),</text>
  <text x="1000" y="335" class="small">-0.018 pp (2050)</text>

  <text x="1000" y="380" class="small">Consumption share deviation:</text>
  <text x="1000" y="405" class="small">-0.087 pp (2030), -0.041 pp (2040),</text>
  <text x="1000" y="430" class="small">+0.061 pp (2050)</text>

  <text x="1000" y="475" class="small">Energy intensity deviation:</text>
  <text x="1000" y="500" class="small neg">-1.880 pp (2030), -1.636 pp (2040), -0.850 pp (2050)</text>

  <text x="1000" y="545" class="small">Emissions index:</text>
  <text x="1000" y="570" class="small neu">No change across EE scenarios in this run set</text>

  <text x="1000" y="615" class="small">BESS macro contribution:</text>
  <text x="1000" y="640" class="small neu">Small (Directive10 and NoBESS nearly overlap)</text>

  <path class="arrow" d="M400 192 L500 192"/>
  <path class="arrow" d="M400 355 L500 322"/>
  <path class="arrow" d="M400 520 L500 452"/>

  <path class="arrow" d="M860 192 L980 230"/>
  <path class="arrow" d="M860 322 L980 350"/>
  <path class="arrow" d="M860 452 L980 500"/>
  <path class="arrow" d="M860 582 L980 565"/>
</svg>
