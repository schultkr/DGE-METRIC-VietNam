<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1696" height="930"
     viewBox="0 0 1696 930">
  <title>Nested counterfactual framework for Viet Nam's energy transition</title>
  <desc>A common benchmark economy feeds the PDP8 baseline, followed by three policy branches whose comparison isolates emissions, demand and investment mechanisms.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#102A56"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1696" height="930" fill="#FFFFFF"/>

<rect x="20" y="22" width="545" height="287" rx="14" fill="#FFFFFF" stroke="#102A56" stroke-width="3"/>
<text x="292" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#102A56"><tspan x="292" dy="0">Common benchmark economy</tspan></text>
<line x1="20" y1="91" x2="565" y2="91" stroke="#AEB8C2" stroke-width="2"/>
<text x="292" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#202B33"><tspan x="292" dy="0">Identical calibration</tspan></text>
<line x1="20" y1="148" x2="565" y2="148" stroke="#CCD3D9" stroke-width="1.5"/>
<text x="292" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#202B33"><tspan x="292" dy="0">Same model structure</tspan></text>
<line x1="20" y1="202" x2="565" y2="202" stroke="#CCD3D9" stroke-width="1.5"/>
<text x="292" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#202B33"><tspan x="292" dy="0">Same initial steady state</tspan></text>
<line x1="20" y1="256" x2="565" y2="256" stroke="#CCD3D9" stroke-width="1.5"/>
<text x="292" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#202B33"><tspan x="292" dy="0">Deterministic transition path</tspan></text>
<line x1="565" y1="151" x2="672" y2="151" stroke="#102A56" stroke-width="7" marker-end="url(#arrow)"/>
<rect x="682" y="42" width="500" height="220" rx="14" fill="#103B70" stroke="#103B70" stroke-width="3"/>
<text x="932" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF"><tspan x="932" dy="0">PDP8 baseline</tspan></text>
<text x="932" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#FFFFFF"><tspan x="932" dy="0">Policy-consistent benchmark</tspan></text>
<line x1="932" y1="262" x2="932" y2="348" stroke="#102A56" stroke-width="7"/>
