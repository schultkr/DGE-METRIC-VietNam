<line x1="897" y1="676" x2="897" y2="718" stroke="#102A56" stroke-width="7" marker-end="url(#arrow)"/>
<rect x="432" y="723" width="896" height="120" rx="14" fill="#FFFFFF" stroke="#102A56" stroke-width="3"/>
<text x="880" y="773" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#102A56"><tspan x="880" dy="0">Mechanism decomposition</tspan></text>
<text x="880" y="817" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#202B33"><tspan x="880" dy="0">Scenario differences isolate marginal policy contributions</tspan></text>
<text x="848" y="892" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#202B33" font-style="italic"><tspan x="848" dy="0">Only shock paths differ across scenarios</tspan></text>
</svg>