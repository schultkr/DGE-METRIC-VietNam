<text x="1411.0" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF"><tspan x="1411.0" dy="0">Transition finance</tspan></text>
<text x="1411.0" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#202B33"><tspan x="1411.0" dy="0">Modified cost of capital</tspan></text>
<text x="1411.0" y="598" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#B82C2C"><tspan x="1411.0" dy="0">Investment channel</tspan></text>
