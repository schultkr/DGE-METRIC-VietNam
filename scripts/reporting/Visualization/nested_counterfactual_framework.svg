<text x="897.0" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#202B33"><tspan x="897.0" dy="0">Demand-side efficiency shocks</tspan></text>
<text x="897.0" y="598" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#D58C00"><tspan x="897.0" dy="0">Demand channel</tspan></text>
