<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1309" viewBox="0 0 1600 1309">
  <title>From model results to implementation in Viet Nam's institutional context</title>
  <desc>Editable vector table linking each policy pillar to its key model result, policy implication, an institutionally constrained solution and the main implementation barriers.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="1309" fill="#F5F8FA"/>
<rect x="0" y="0" width="1600" height="16" fill="#242B84"/>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#28313C"></text>
<text x="40" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#9DA6AE"><tspan x="40" dy="17.0"></tspan></text>
<rect x="40" y="184" width="1520" height="68.0" fill="#242B84" filter="url(#shadow)"/>
<text x="54" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15.0" font-weight="700" fill="#FFFFFF"><tspan x="54" dy="15.0">Key model result</tspan></text>
<text x="394" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15.0" font-weight="700" fill="#FFFFFF"><tspan x="394" dy="15.0">Policy implication (derived from the</tspan><tspan x="394" dy="19.0">model)</tspan></text>
<text x="744" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15.0" font-weight="700" fill="#FFFFFF"><tspan x="744" dy="15.0">Proposed solution — institutional &amp; regulatory</tspan><tspan x="744" dy="19.0">constraints</tspan></text>
<text x="1214" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15.0" font-weight="700" fill="#FFFFFF"><tspan x="1214" dy="15.0">Potential barriers to implementation</tspan></text>
<rect x="40" y="252.0" width="1520" height="201.0" fill="#FFFFFF" stroke="#C0C7CD" stroke-width="1"/>
<rect x="40" y="252.0" width="5" height="201.0" fill="#242B84"/>
<circle cx="65" cy="276.0" r="11" fill="#242B84"/>
<text x="65" y="281.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<text x="84" y="281.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#28313C">Efficiency first</text>
<text x="54" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="54" dy="14.5" textLength="312.0" lengthAdjust="spacing">Accelerating energy efficiency,</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">technological upgrading and fuel</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">switching lowers electricity demand,</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">generation and grid investment needs, and</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">the carbon price required to stay on the</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">net-zero path. It delivers the largest</tspan><tspan x="54" dy="19.0">modelled economic gain per unit of cost.</tspan></text>
<text x="394" y="268.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="394" dy="14.5" textLength="322.0" lengthAdjust="spacing">Put demand-side efficiency at the centre</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">of PDP8-rev implementation and treat</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">avoided demand as a system resource on a</tspan><tspan x="394" dy="19.0">par with new supply.</tspan></text>
<text x="744" y="268.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="744" dy="14.5" textLength="442.0" lengthAdjust="spacing">Enforce minimum energy-performance standards and the</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">Directive 10/CT-TTg electricity-saving targets through</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">binding sub-sector energy-intensity benchmarks and</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">mandatory audits for designated large energy users;</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">capitalise a revolving efficiency fund and ESCO / energy-</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">performance contracting under the State Bank green-credit</tspan><tspan x="744" dy="19.0">framework.</tspan></text>
<text x="1214" y="268.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="1214" dy="14.5" textLength="332.0" lengthAdjust="spacing">Split incentives between landlords and</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">tenants and within SOEs; limited</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">measurement, reporting and verification</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">(MRV) and enforcement capacity at provincial</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">DOIT level; subsidised retail tariffs</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">lengthen payback; thin ESCO market and short</tspan><tspan x="1214" dy="19.0">project-finance track record.</tspan></text>
<rect x="40" y="453.0" width="1520" height="182.0" fill="#E4E7EA" stroke="#C0C7CD" stroke-width="1"/>
<rect x="40" y="453.0" width="5" height="182.0" fill="#C8781E"/>
<circle cx="65" cy="477.0" r="11" fill="#C8781E"/>
<text x="65" y="482.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<text x="84" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#28313C">Carbon pricing with enabling policies</text>
<text x="54" y="507.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="54" dy="14.5" textLength="312.0" lengthAdjust="spacing">The emissions trading system (ETS) is</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">markedly less costly when firms also have</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">efficiency options and affordable</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">finance. A gradual, coordinated price</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">path reaches the emissions trajectory at</tspan><tspan x="54" dy="19.0">lower GDP cost than carbon pricing alone.</tspan></text>
<text x="394" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="394" dy="14.5" textLength="322.0" lengthAdjust="spacing">Phase the ETS in gradually, sequence it</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">after efficiency and renewable-energy</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">enabling measures, and give firms a</tspan><tspan x="394" dy="19.0">predictable long-term price signal.</tspan></text>
<text x="744" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="744" dy="14.5" textLength="442.0" lengthAdjust="spacing">Run the 2025-2028 pilot under Decree 06/2022/ND-CP and the</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">amended Law on Environmental Protection with free,</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">benchmarked allocation for trade-exposed industry; align</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">the domestic price and MRV rules with the EU CBAM</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">timeline; complete the national GHG inventory and registry</tspan><tspan x="744" dy="19.0">and ring-fence a price-stability reserve.</tspan></text>
<text x="1214" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="1214" dy="14.5" textLength="332.0" lengthAdjust="spacing">Incomplete facility-level emissions data;</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">carbon-leakage and competitiveness concerns</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">for cement, steel and textiles;</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">institutional capacity to operate MRV,</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">registry and auctions; political sensitivity</tspan><tspan x="1214" dy="19.0">of higher energy prices.</tspan></text>
<rect x="40" y="635.0" width="1520" height="163.0" fill="#FFFFFF" stroke="#C0C7CD" stroke-width="1"/>
<rect x="40" y="635.0" width="5" height="163.0" fill="#B2C823"/>
<circle cx="65" cy="659.0" r="11" fill="#B2C823"/>
<text x="65" y="664.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#28313C">3</text>
<text x="84" y="664.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#28313C">Affordable green finance</text>
<text x="54" y="689.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="54" dy="14.5" textLength="312.0" lengthAdjust="spacing">Lowering the weighted average cost of</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">capital — not raising the volume of</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">public spending — accelerates investment</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">and raises the economic payoff from</tspan><tspan x="54" dy="19.0">greater climate ambition.</tspan></text>
<text x="394" y="651.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="394" dy="14.5" textLength="322.0" lengthAdjust="spacing">Prioritise instruments that cut financing</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">cost and risk: blended finance,</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">guarantees, risk-sharing facilities, green</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">bonds and green credit, delivered through</tspan><tspan x="394" dy="19.0">the JETP and the national green taxonomy.</tspan></text>
<text x="744" y="651.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="744" dy="14.5" textLength="442.0" lengthAdjust="spacing">Operationalise the green taxonomy and the State Bank</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">green-banking framework; deploy partial credit guarantees</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">and FX-hedging facilities within the public-debt ceiling</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">and limited fiscal space; standardise bankable PPA terms</tspan><tspan x="744" dy="19.0">and dispute resolution; speed JETP disbursement.</tspan></text>
<text x="1214" y="651.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="1214" dy="14.5" textLength="332.0" lengthAdjust="spacing">Sovereign and EVN off-taker credit risk;</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">currency mismatch and a shallow domestic</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">capital market; PPAs not yet bankable for</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">many projects; public-debt and contingent-</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">liability limits on guarantees; slow</tspan><tspan x="1214" dy="19.0">mobilisation of pledged concessional funds.</tspan></text>
<rect x="40" y="798.0" width="1520" height="201.0" fill="#E4E7EA" stroke="#C0C7CD" stroke-width="1"/>
<rect x="40" y="798.0" width="5" height="201.0" fill="#5286D2"/>
<circle cx="65" cy="822.0" r="11" fill="#5286D2"/>
<text x="65" y="827.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
<text x="84" y="827.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#28313C">Strategic use of ETS revenues</text>
<text x="54" y="852.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="54" dy="14.5" textLength="312.0" lengthAdjust="spacing">Recycling ETS revenue through non-fossil</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">capital-tax reductions or targeted</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">investment support stimulates investment</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">more than broad per-capita dividends;</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">targeted transfers still protect</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">vulnerable households at low aggregate</tspan><tspan x="54" dy="19.0">cost.</tspan></text>
<text x="394" y="814.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="394" dy="14.5" textLength="322.0" lengthAdjust="spacing">Earmark ETS revenue for transition</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">investment and a just-transition fund</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">rather than the general budget or</tspan><tspan x="394" dy="19.0">untargeted rebates.</tspan></text>
<text x="744" y="814.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="744" dy="14.5" textLength="442.0" lengthAdjust="spacing">Given State Budget Law limits on hypothecating tax</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">revenue, route receipts through a dedicated environmental-</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">protection / transition fund with a statutory revenue</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">mandate and published accounts; use existing social-</tspan><tspan x="744" dy="19.0">assistance registries for targeted household transfers.</tspan></text>
<text x="1214" y="814.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="1214" dy="14.5" textLength="332.0" lengthAdjust="spacing">Legal restrictions on earmarking; competing</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">budget priorities; weak targeting coverage</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">for informal-sector households; governance</tspan><tspan x="1214" dy="19.0">and transparency risk in fund management.</tspan></text>
<rect x="40" y="999.0" width="1520" height="239.0" fill="#FFFFFF" stroke="#C0C7CD" stroke-width="1"/>
<rect x="40" y="999.0" width="5" height="239.0" fill="#F0D019"/>
<circle cx="65" cy="1023.0" r="11" fill="#F0D019"/>
<text x="65" y="1028.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#28313C">5</text>
<text x="84" y="1028.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#28313C">Reliable and inclusive transition</text>
<text x="54" y="1053.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="54" dy="14.5" textLength="312.0" lengthAdjust="spacing">Treating battery storage as a grid-</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">reliability requirement and supporting</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">labour mobility, retraining and skills</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">lowers adjustment costs and strengthens</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">resilience. Headline efficiency gains are</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">conditional on the assumed rooftop-solar</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">rollout; BESS contributes through system</tspan><tspan x="54" dy="19.0" textLength="312.0" lengthAdjust="spacing">reliability rather than through aggregate</tspan><tspan x="54" dy="19.0">GDP.</tspan></text>
<text x="394" y="1015.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="394" dy="14.5" textLength="322.0" lengthAdjust="spacing">Plan storage and flexibility alongside</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">renewable capacity in PDP8-rev, and pair</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">transition policy with active labour-</tspan><tspan x="394" dy="19.0" textLength="322.0" lengthAdjust="spacing">market and regional support for fossil-</tspan><tspan x="394" dy="19.0">dependent provinces and workers.</tspan></text>
<text x="744" y="1015.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="744" dy="14.5" textLength="442.0" lengthAdjust="spacing">Introduce a capacity / ancillary-services market and a</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">storage procurement mandate; finalise direct power</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">purchase agreement (DPPA) and rooftop-solar rules; fund</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">reskilling through the vocational system and the</tspan><tspan x="744" dy="19.0" textLength="442.0" lengthAdjust="spacing">Employment Fund; provide targeted support to coal-</tspan><tspan x="744" dy="19.0">dependent communities such as Quang Ninh.</tspan></text>
<text x="1214" y="1015.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#28313C"><tspan x="1214" dy="14.5" textLength="332.0" lengthAdjust="spacing">No market mechanism yet remunerates storage</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">or flexibility; EVN single-buyer model and</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">grid-code gaps; fiscal cost of reskilling;</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">concentrated coal-sector employment and SOE-</tspan><tspan x="1214" dy="19.0" textLength="332.0" lengthAdjust="spacing">restructuring politics; land and grid-</tspan><tspan x="1214" dy="19.0">connection permitting delays.</tspan></text>
<line x1="380" y1="184" x2="380" y2="1238.0" stroke="#C0C7CD" stroke-width="1"/>
<line x1="730" y1="184" x2="730" y2="1238.0" stroke="#C0C7CD" stroke-width="1"/>
<line x1="1200" y1="184" x2="1200" y2="1238.0" stroke="#C0C7CD" stroke-width="1"/>
<text x="40" y="1260.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#9DA6AE"><tspan x="40" dy="13.0">Model results are directional, scenario-relative magnitudes from DGE-METRIC (five-sector annual general equilibrium, 2026-2050) under stated assumptions — not point forecasts.</tspan></text>
</svg>